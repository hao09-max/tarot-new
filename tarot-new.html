<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗占卜</title>
<style>
body{background:#1a0b2e;color:#e0d7ff;text-align:center;padding:20px;font-family:Arial}
button{padding:10px 20px;border-radius:20px;border:none;background:#6c3faa;color:#fff;margin:5px;font-size:1rem}
#result{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.card{background:rgba(255,255,255,0.1);border-radius:15px;padding:10px;width:120px;box-sizing:border-box}
.card img,.card span{font-size:3rem}
.card h4{margin:5px 0;font-size:0.9rem}
.card p{font-size:0.7rem;line-height:1.4}
</style>
</head>
<body>
<h1>🔮 塔罗占卜</h1>
<div id="spreads">
<button onclick="setSpread(1)" class="active">单张</button>
<button onclick="setSpread(2)">过去·现在·未来</button>
<button onclick="setSpread(3)">六芒星</button>
<button onclick="setSpread(4)">爱情关系</button>
</div>
<button onclick="draw()">🃏 抽取塔罗牌</button>
<div id="result"></div>
<script>
// 音频上下文
let audioCtx;
function playSound(){
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
const now=audioCtx.currentTime;
const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator();
const g1=audioCtx.createGain(),g2=audioCtx.createGain();
o1.type='sine';o1.frequency.setValueAtTime(880,now);o1.frequency.exponentialRampToValueAtTime(440,now+0.5);
o2.type='triangle';o2.frequency.setValueAtTime(1175,now+0.1);o2.frequency.exponentialRampToValueAtTime(587,now+0.6);
g1.gain.setValueAtTime(0.3,now);g1.gain.exponentialRampToValueAtTime(0.01,now+0.8);
g2.gain.setValueAtTime(0.2,now+0.1);g2.gain.exponentialRampToValueAtTime(0.01,now+0.9);
o1.connect(g1).connect(audioCtx.destination);o1.start(now);o1.stop(now+0.8);
o2.connect(g2).connect(audioCtx.destination);o2.start(now+0.1);o2.stop(now+0.9);
}
// 塔罗牌数据（22张大阿尔卡纳）
const deck=[
["愚者","🃏","新开始，冒险","鲁莽，计划不周"],
["魔术师","🪄","创造力，信心","欺诈，计划受阻"],
["女祭司","🔮","直觉，智慧","忽视直觉"],
["皇后","👑","丰收，母性","依赖，不安全"],
["皇帝","🏰","权威，稳定","专制，僵化"],
["教皇","⛪","信仰，指引","教条，误导"],
["恋人","💞","和谐，选择","分离，冲突"],
["战车","🏇","胜利，决心","失控，迷失"],
["力量","🦁","勇气，耐心","软弱，冲动"],
["隐士","🏮","内省，真理","孤立，逃避"],
["命运之轮","🎡","转折，幸运","厄运，停滞"],
["正义","⚖️","公平，真相","不公，偏见"],
["倒吊人","🪢","换位思考","无谓牺牲"],
["死神","💀","结束，重生","抗拒改变"],
["节制","🕊️","平衡，调和","极端，放纵"],
["恶魔","👹","欲望，束缚","挣脱，觉醒"],
["高塔","🗼","突变，启示","恐惧，逃避"],
["星星","⭐","希望，疗愈","失望，失去信心"],
["月亮","🌙","潜意识，不安","清醒，克服恐惧"],
["太阳","☀️","快乐，成功","挫折，忧伤"],
["审判","📯","觉醒，宽恕","自我怀疑"],
["世界","🌍","完成，圆满","延迟，未完成"]
];
let spread=1;
function setSpread(s){
spread=s;
document.querySelectorAll('#spreads button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('result').innerHTML='';
}
function draw(){
playSound();
const count=[1,3,6,4][spread-1];
const positions=spread===1?['指引']:spread===2?['过去','现在','未来']:spread===3?['现状','阻碍','过去','未来','对策','结果']:['你的想法','对方想法','关系现状','未来走向'];
let html='';
for(let i=0;i<count;i++){
const card=deck[Math.floor(Math.random()*22)];
const rev=Math.random()<0.5;
html+=`<div class="card"><span>${card[1]}</span><h4>${positions[i]}：${card[0]}${rev?'(逆)':''}</h4><p>${rev?card[3]:card[2]}</p></div>`;
}
document.getElementById('result').innerHTML=html;
}
</script>
</body>
</html>
